name: Scrape listings

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Lokalita, i víc oblastí najednou oddělených středníkem (např. Šumava; Český ráj). PRÁZDNÉ = všechny oblasti, KRAJE = jen chata.cz po krajích (doplnění kraje a chybějících nabídek)"
        required: false
        default: ""
      min_capacity:
        description: "Minimální kapacita (osob)"
        required: false
        default: ""
      min_bedrooms:
        description: "Minimální počet ložnic"
        required: false
        default: ""
      max_price:
        description: "Maximální cena za noc (Kč)"
        required: false
        default: ""
      amenities:
        description: "Vybavení (čárkou oddělený seznam, např. bazén,sauna,krb)"
        required: false
        default: ""
      date_from:
        description: "Datum od (YYYY-MM-DD)"
        required: false
        default: ""
      date_to:
        description: "Datum do (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

# Dva souběžné běhy by si navzájem přepsaly docs/data/ – běhy čekají ve frontě.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Čerstvý stav větve v okamžiku startu (ne stav z doby spuštění ve frontě)
          ref: ${{ github.ref_name }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape and save (one region after another)
        env:
          CRIT_LOCATION_ALL: ${{ github.event.inputs.location }}
          CRIT_MIN_CAPACITY: ${{ github.event.inputs.min_capacity }}
          CRIT_MIN_BEDROOMS: ${{ github.event.inputs.min_bedrooms }}
          CRIT_MAX_PRICE: ${{ github.event.inputs.max_price }}
          CRIT_AMENITIES: ${{ github.event.inputs.amenities }}
          CRIT_DATE_FROM: ${{ github.event.inputs.date_from }}
          CRIT_DATE_TO: ${{ github.event.inputs.date_to }}
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Uloží výsledek jedné oblasti. index.json je odvozený soubor: necommituje se
          # z běhu, ale po načtení nejnovějšího stavu se vždy přegeneruje (žádné konflikty).
          save() {
            git add docs/data ':!docs/data/index.json'
            git checkout -- docs/data/index.json 2>/dev/null
            git diff --staged --quiet || git commit -q -m "chore: update data ($1) [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            for i in 1 2 3 4; do
              git pull -q --rebase \
                && python -m scraper.store index \
                && git add docs/data/index.json \
                && { git diff --staged --quiet || git commit -q -m "chore: update index"; } \
                && git push -q && return 0
              echo "Uložení se nepodařilo (pokus $i), zkouším znovu"; git rebase --abort 2>/dev/null; sleep 8
            done
            return 1
          }

          # Prázdné pole Lokalita = všechny oblasti ze seznamu (docs/data/mapa-cr.json)
          ONLY_KRAJE=0
          if [ "$(echo "$CRIT_LOCATION_ALL" | xargs | tr '[:upper:]' '[:lower:]')" = "kraje" ]; then
            ONLY_KRAJE=1
            CRIT_LOCATION_ALL=""
            LOCS=()
          elif [ -z "$(echo "$CRIT_LOCATION_ALL" | xargs)" ]; then
            CRIT_LOCATION_ALL="$(python -m scraper.regions)"
            echo "Lokalita nezadána -> všechny oblasti: $CRIT_LOCATION_ALL"
          fi
          if [ "$ONLY_KRAJE" = 0 ]; then
            IFS=';' read -ra LOCS <<< "$CRIT_LOCATION_ALL"
            [ ${#LOCS[@]} -eq 0 ] && LOCS=("")
          fi
          fail=0
          for loc in "${LOCS[@]}"; do
            loc="$(echo "$loc" | xargs)"
            echo "::group::${loc:-bez lokality}"
            CRIT_LOCATION="$loc" python -m scraper.main || { echo "::error::Scraper pro '$loc' skončil chybou"; fail=1; }
            save "${loc:-bez lokality}" || { echo "::error::Uložení pro '$loc' selhalo"; fail=1; }
            echo "::endgroup::"
          done
          # chata.cz po krajích: přidělí kraj nabídkám chata.cz (karta nemá GPS) a doplní ty, které žádná oblast nepokrývá
          echo "::group::chata.cz po krajích"
          python -m scraper.chata_kraje || { echo "::error::chata.cz po krajích skončilo chybou"; fail=1; }
          # duplicity: stejná chata na víc portálech (jen seznam skupin, data se nemění)
          python -m scraper.dedupe || { echo "::error::hledání duplicit skončilo chybou"; fail=1; }
          save "chata.cz po krajích a duplicity" || { echo "::error::Uložení po krajích selhalo"; fail=1; }
          echo "::endgroup::"
          exit $fail
