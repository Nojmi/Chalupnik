name: Scrape listings

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Lokalita (např. Šumava, Krkonoše)"
        required: false
        default: ""
      min_capacity:
        description: "Minimální kapacita (osob)"
        required: false
        default: ""
      min_bedrooms:
        description: "Minimální počet ložnic"
        required: false
        default: ""
      max_price:
        description: "Maximální cena za noc (Kč)"
        required: false
        default: ""
      amenities:
        description: "Vybavení (čárkou oddělený seznam, např. bazén,sauna,krb)"
        required: false
        default: ""
      date_from:
        description: "Datum od (YYYY-MM-DD)"
        required: false
        default: ""
      date_to:
        description: "Datum do (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          CRIT_LOCATION: ${{ github.event.inputs.location }}
          CRIT_MIN_CAPACITY: ${{ github.event.inputs.min_capacity }}
          CRIT_MIN_BEDROOMS: ${{ github.event.inputs.min_bedrooms }}
          CRIT_MAX_PRICE: ${{ github.event.inputs.max_price }}
          CRIT_AMENITIES: ${{ github.event.inputs.amenities }}
          CRIT_DATE_FROM: ${{ github.event.inputs.date_from }}
          CRIT_DATE_TO: ${{ github.event.inputs.date_to }}
        run: python -m scraper.main

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/latest.json
          git diff --staged --quiet || git commit -m "chore: update latest.json [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push
