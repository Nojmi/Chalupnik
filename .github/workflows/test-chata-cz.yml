name: Test chata.cz access (recon, dočasné)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Test chata.cz endpoints from Actions runner
        run: |
          python - <<'EOF'
          import requests

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8",
              "Accept-Language": "cs-CZ,cs;q=0.9,en;q=0.8",
              "Accept-Encoding": "gzip, deflate, br",
              "Connection": "keep-alive",
          }
          AJAX_HEADERS = dict(HEADERS, **{
              "Accept": "application/json, text/javascript, */*; q=0.01",
              "X-Requested-With": "XMLHttpRequest",
          })

          tests = [
              ("homepage", "https://www.chata.cz/", HEADERS, {}),
              ("AutocompleteRegions", "https://www.chata.cz/AutocompleteRegions/", AJAX_HEADERS, {}),
              ("Autocomplete/Sumava", "https://www.chata.cz/Autocomplete/Sumava", AJAX_HEADERS, {}),
              ("vyhledavani Sumava", "https://www.chata.cz/vyhledavani/", HEADERS, {
                  "Where": "Sumava", "Autocomplete.LocationId": 49, "Autocomplete.LocationType": 6,
                  "Distance": 0, "Adults": 2, "GuestsType": "TwoAdults", "RoomAmountType": "More",
                  "PageSize": 10, "SortingType": "Regio", "page": 1,
              }),
          ]

          for label, url, headers, params in tests:
              try:
                  r = requests.get(url, headers=headers, params=params, timeout=20)
                  print(f"{label}: status={r.status_code} len={len(r.content)} content-type={r.headers.get('Content-Type')}")
                  if r.status_code != 200:
                      print(f"  body preview: {r.text[:300]!r}")
              except Exception as e:
                  print(f"{label}: EXCEPTION {type(e).__name__} {e}")
          EOF
